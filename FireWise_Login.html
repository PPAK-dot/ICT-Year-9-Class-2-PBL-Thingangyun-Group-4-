
<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FireWise | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="FireWise_Login.css">
    <link rel="icon" type="image/x-icon" href="FireWise_Logo.png">
</head>

<body>

    <main class="login-container">

        <!-- LEFT IMAGE -->
        <section class="image-side">
            <img src="Login.jpg" alt="Fire safety image">
        </section>

        <!-- RIGHT LOGIN FORM -->
        <section class="login-side">

            <div class="login-content">

                <div class="logo-container">
                    <img src="FireWise_Logo.png" alt="FireWise Logo">
                </div>

                <div class="login-heading">
                    <p class="welcome-text">WELCOME TO FIREWISE</p>
                    <h1>Log In</h1>
                    <p>Access your FireWise account.</p>
                </div>

                <form id="loginForm" novalidate>

                    <!-- EMAIL -->
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>

                        <div class="input-container">
                            <i class="bi bi-envelope"></i>

                            <input type="email" id="loginEmail"
                                placeholder="Enter your email">
                        </div>

                        <small id="email-error" class="error-message"></small>
                    </div>

                    <!-- PASSWORD -->
                    <div class="form-group">
                        <label for="loginPassword">Password</label>

                        <div class="input-container">
                            <i class="bi bi-lock"></i>

                            <input type="password" id="loginPassword"
                                placeholder="Enter your password">

                            <button type="button" class="password-toggle"
                                id="togglePassword"
                                aria-label="Show password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>

                        <small id="password-error" class="error-message"></small>
                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="login-button">
                        Log In
                        <i class="bi bi-arrow-right"></i>
                    </button>

                    <p id="login-result" class="login-result"></p>

                </form>

                <div class="login-bottom">
                    <p>FireWise | Fire Safety Awareness Myanmar</p>
                </div>

            </div>

        </section>

    </main>

    <script src="FireWise_Login.js"></script>

</body>
</html>
